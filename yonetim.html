<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galeri Yönetimi — Tekirdağ Köpek Köyü</title><style>
:root{--green:#1b7b58;--green2:#0e5c42;--cream:#f2f6e5;--paper:#fff8e9;--ink:#16251c;--muted:#52645a;--line:rgba(22,37,28,.12)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:0 auto;padding:48px 0 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}.brand{font-weight:900;color:var(--green2)}.btn{border:0;border-radius:14px;padding:12px 17px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.light{background:#fff;border:1px solid var(--line)}.danger{background:#fff0ed;color:#b33a2f;border:1px solid #f1c3bb}.panel{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:0 18px 50px rgba(18,54,39,.1)}.login{max-width:480px;margin:12vh auto}.login h1{margin:0 0 8px;font-size:32px}.login p{color:var(--muted)}label{display:block;font-weight:800;font-size:13px;margin:18px 0 7px}input[type=text],input[type=password],input[type=file]{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff}#app{display:none}.upload{border:2px dashed rgba(27,123,88,.28);padding:28px;border-radius:22px;background:#fbfdf5;margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.item{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 22px rgba(18,54,39,.07)}.item img{width:100%;aspect-ratio:1;object-fit:cover}.item .meta{padding:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px}.msg{margin-top:12px;color:var(--muted);min-height:20px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding-top:28px}.top{align-items:flex-start;flex-direction:column}.panel{padding:22px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div id="login" class="panel login"><div class="brand">🐾 TEKİRDAĞ KÖPEK KÖYÜ</div><h1>GALERİ YÖNETİMİ</h1><p>Bu alan yalnızca yetkili kişi içindir.</p><form id="loginForm"><label>Kullanıcı adı</label><input id="user" type="text" autocomplete="username" required><label>Şifre</label><input id="pass" type="password" autocomplete="current-password" required><button class="btn primary" style="width:100%;margin-top:20px">GİRİŞ YAP</button><div class="msg" id="loginMsg"></div></form><a href="/" style="display:block;margin-top:18px;color:var(--green2);font-weight:800">← Siteye dön</a></div>
<div id="app"><div class="top"><div><div class="brand">🐾 TEKİRDAĞ KÖPEK KÖYÜ</div><h1 style="margin:6px 0 0">GALERİYİ YÖNET</h1></div><div><a class="btn light" href="/">Siteyi Görüntüle</a> <button class="btn danger" id="logout">Çıkış Yap</button></div></div><div class="panel"><div class="upload"><h2 style="margin-top:0">Yeni Fotoğraf Yükle</h2><input id="file" type="file" accept="image/*"><button class="btn primary" id="upload" style="margin-top:12px">+ FOTOĞRAF YÜKLE</button><div class="msg" id="uploadMsg">JPG, PNG veya WEBP · Maksimum 10 MB</div></div><h2>Mevcut Fotoğraflar</h2><div class="grid" id="photos"></div></div></div></div>
<script>
const $=id=>document.getElementById(id);async function api(url,opt={}){const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'İşlem başarısız.');return d}
async function check(){try{await load()}catch{}}async function load(){const d=await api('/api/photos');$('login').style.display='none';$('app').style.display='block';const g=$('photos');g.innerHTML='';if(!d.photos.length){g.innerHTML='<p style="color:var(--muted)">Henüz fotoğraf yok.</p>';return}d.photos.forEach(p=>{const el=document.createElement('div');el.className='item';el.innerHTML=`<img src="/api/photo?key=${encodeURIComponent(p.key)}" alt=""><div class="meta"><span>${p.name}</span><button class="btn danger" data-key="${p.key}">Sil</button></div>`;el.querySelector('button').onclick=async()=>{if(!confirm('Bu fotoğraf silinsin mi?'))return;try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:p.key})});load()}catch(e){alert(e.message)}};g.appendChild(el)})}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});await load()}catch(e){$('loginMsg').textContent=e.message}};
$('upload').onclick=async()=>{const f=$('file').files[0];if(!f){$('uploadMsg').textContent='Önce bir fotoğraf seçin.';return}const fd=new FormData();fd.append('photo',f);$('uploadMsg').textContent='Yükleniyor...';try{await api('/api/upload',{method:'POST',body:fd});$('file').value='';$('uploadMsg').textContent='Fotoğraf yüklendi. 🐾';load()}catch(e){$('uploadMsg').textContent=e.message}};
$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.reload()};
</script></body></html>
